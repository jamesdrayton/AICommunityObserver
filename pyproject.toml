[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AICommunityObserver"
dynamic = ["dependencies]
version = "0.4"
description = "A tool for autonomously observing and analyzing AI applications"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
  { name="James Drayton Beninger", email="jamesdrayton18@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/jamesdrayton/AICommunityObserver"
Documentation = "https://github.com/jamesdrayton/AICommunityObserver#readme"
Issues = "https://github.com/jamesdrayton/AICommunityObserver/issues"
Source = "https://github.com/jamesdrayton/AICommunityObserver"

[tool.hatch.metadata.hooks.requirements_txt]
files = "requirements.txt"

[project.entry-points."aicommunityobserver.metrics"]
bias = "aco_bias_metrics"